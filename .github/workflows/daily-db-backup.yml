name: Daily DB Backup

# This workflow remains disabled in GitHub until the separately authorized A4/A5
# proof. The source below is an encrypted-only candidate; it never publishes a
# database archive to GitHub.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated backup tooling
        run: npm ci --ignore-scripts --omit=dev --prefix .github/scripts/backup

      - name: Install PostgreSQL 17 client
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes --output /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Create, verify, and retain encrypted backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          VERCEL_TELEMETRY_DISABLED: '1'
        run: bash .github/scripts/backup/backup.sh

      - name: Report encrypted backup failure
        if: failure()
        run: bash .github/scripts/backup/report-failure.sh
